name: UI preview
on:
  push:
    branches:
      - 'feature/compact-footer-*'
  pull_request:
    paths:
      - 'app/main_window.py'
      - 'app/theme.py'
      - 'app/nav_icons.py'
      - 'app/subscriptions_dialog.py'
      - 'tools/capture_ui.py'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Capture actual PySide6 interface (3 widths, 4 pages)
        run: python tools/capture_ui.py --output screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ambox-ui-preview
          path: screenshots/
          retention-days: 7
